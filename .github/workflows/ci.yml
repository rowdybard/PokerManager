name: CI

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_ANON_KEY: ci-anon-key-not-used-000000000
  VITE_APP_URL: http://127.0.0.1:4173
  VITE_EMAIL_ENABLED: 'false'
  VITE_PLAID_ENABLED: 'false'

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint
      - run: node tests/scripts/check-content.mjs
      - run: npm run test
      - name: Type-check Edge Functions
        shell: bash
        run: find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | xargs -0 -r deno check --frozen --config supabase/functions/deno.json
      - run: npm run build
      - run: npm audit --omit=dev

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npx supabase db lint --level warning --fail-on warning
      - name: Verify generated database types
        shell: bash
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.ts
          sed '/^  \/\/ Allows to automatically instantiate createClient with right options$/,/^  }$/d' \
            src/types/database.ts > /tmp/database-expected.ts
          sed '/^  \/\/ Allows to automatically instantiate createClient with right options$/,/^  }$/d' \
            /tmp/database.ts > /tmp/database-actual.ts
          diff -u -B /tmp/database-expected.ts /tmp/database-actual.ts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
